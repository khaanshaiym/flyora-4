<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flyora - User Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex flex-column min-vh-100">

<header class="border-bottom py-2">
    <div class="container d-flex justify-content-between align-items-center">
        <a class="navbar-brand logo d-flex align-items-center gap-2" href="index.html">
            <span class="logo-icon">✦</span>
            <span class="logo-text fw-bold">Flyora</span>
        </a>
        <a href="index.html" class="btn btn-outline-secondary btn-sm">Home</a>
    </div>
</header>

<main class="flex-grow-1 py-5 d-flex align-items-center">
    <div class="container" style="max-width: 600px;">
        <div class="card p-4 shadow-sm border-0 rounded-4 text-center">
            <div class="mb-3">
                <div class="bg-dark text-white rounded-circle d-inline-flex align-items-center justify-content-center fw-bold fs-2" style="width: 80px; height: 80px;" id="profileAvatar">U</div>
            </div>
            <h2 class="fw-bold mb-1" id="profileName">User Name</h2>
            <p class="text-muted small mb-4" id="profileEmail">user@example.com</p>

            <div class="border-top pt-3 text-start">
                <p class="mb-2"><strong>Phone:</strong> <span id="profilePhone" class="text-muted">-</span></p>
                <p class="mb-2"><strong>Account Status:</strong> <span class="badge bg-success">Active & Verified</span></p>
                <p class="mb-0"><strong>Saved Bookings:</strong> <span class="text-muted">No active flights booked yet.</span></p>
            </div>

            <div class="mt-4">
                <button id="logoutBtn" class="btn btn-outline-danger btn-sm rounded-pill px-4">Log Out</button>
            </div>
        </div>
    </div>
</main>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="js/script.js"></script>
</body>
</html>
