<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flyora - Login & Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex flex-column min-vh-100 justify-content-center align-items-center bg-light">

<div class="card p-4 shadow-sm border-0 rounded-4 w-100" style="max-width: 400px;">
    <div class="text-center mb-4">
        <a class="navbar-brand logo d-inline-flex align-items-center gap-2 mb-2" href="index.html">
            <span class="logo-icon">✦</span>
            <span class="logo-text fw-bold">Flyora</span>
        </a>
        <h3 class="fw-bold">Welcome Back</h3>
        <p class="text-muted small">Sign up or log in to manage your bookings</p>
    </div>

    <!-- Форма Sign Up / Login -->
    <form id="authForm" novalidate>
        <div class="mb-3" id="nameFieldContainer">
            <label class="form-label small fw-medium">Full Name</label>
            <input type="text" id="authName" class="form-control" placeholder="Enter your name">
            <div class="invalid-feedback text-danger small" id="nameError"></div>
        </div>
        <div class="mb-3">
            <label class="form-label small fw-medium">Email Address</label>
            <input type="email" id="authEmail" class="form-control" placeholder="name@example.com">
            <div class="invalid-feedback text-danger small" id="emailError"></div>
        </div>
        <div class="mb-3">
            <label class="form-label small fw-medium">Password</label>
            <input type="password" id="authPassword" class="form-control" placeholder="At least 6 characters">
            <div class="invalid-feedback text-danger small" id="passwordError"></div>
        </div>
        <div class="mb-3">
            <label class="form-label small fw-medium">Phone Number</label>
            <input type="text" id="authPhone" class="form-control" placeholder="+7 (777) 000-00-00">
            <div class="invalid-feedback text-danger small" id="phoneError"></div>
        </div>

        <button type="submit" id="authSubmitBtn" class="btn btn-dark w-100 py-2 rounded-pill fw-semibold mb-2">Log In</button>
        <button type="button" id="switchAuthMode" class="btn btn-link w-100 text-muted small text-decoration-none">Don't have an account? Sign Up</button>
    </form>

    <div class="text-center mt-3">
        <a href="index.html" class="text-muted small text-decoration-none">← Back to Home</a>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="js/script.js"></script>
</body>
</html>
