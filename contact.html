<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flyora - Contact</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- NAVBAR -->
<header class="border-bottom">
    <div class="container">
        <nav class="navbar navbar-expand-lg navbar-light">
            <a class="navbar-brand logo" href="index.html">
                <span class="logo-icon">✦</span>
                <span class="logo-text">Flyora</span>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav me-3 align-items-center gap-2">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="flights.html">Flights</a></li>
                    <li class="nav-item"><a class="nav-link" href="destinations.html">Destinations</a></li>
                    <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
                </ul>
                <div class="d-flex align-items-center gap-2">
                    <button id="theme-toggle" class="btn">Toggle Theme</button>
                    <a href="destinations.html" class="btn btn-primary btn-explore">Explore →</a>
                </div>
            </div>
        </nav>
    </div>
</header>

<!-- MAIN CONTENT -->
<main class="py-5">
    <div class="container" style="max-width: 700px;">
        <div class="text-center mb-4">
            <span class="text-uppercase tracking-widest text-muted small fw-semibold">Get in Touch</span>
            <h1 class="display-5 fw-bold mt-2 mb-2" style="font-family: serif;">Contact Us</h1>
            <p class="text-muted">Have questions? We are here to help you plan your next travel.</p>
        </div>

        <div class="card p-4 shadow-sm border-0 rounded-4">
            <form>
                <div class="mb-3">
                    <label class="form-label fw-medium small">Your Name</label>
                    <input type="text" class="form-control form-control-lg border-0 bg-light" placeholder="Enter your full name" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-medium small">Email Address</label>
                    <input type="email" class="form-control form-control-lg border-0 bg-light" placeholder="name@example.com" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-medium small">Subject</label>
                    <input type="text" class="form-control form-control-lg border-0 bg-light" placeholder="Flight inquiry, booking, etc.">
                </div>
                <div class="mb-4">
                    <label class="form-label fw-medium small">Message</label>
                    <textarea class="form-control border-0 bg-light" rows="4" placeholder="How can we help you?"></textarea>
                </div>
                <button type="submit" class="btn btn-dark w-100 py-3 rounded-pill fw-semibold">Send Message</button>
            </form>
        </div>
    </div>
</main>

<!-- UNIFIED FOOTER -->
<footer class="custom-footer py-4 mt-5">
    <div class="container text-center">
        <p class="footer-team mb-1">
            <span>Developed by Team:</span>
            <strong>Seifullina Adema, Zholshara Khanshaiym </strong>
            <span class="mx-2 opacity-50">|</span>
            <span>Group:</span>
            <strong>SE-2503</strong>
        </p>
        <p class="mb-0 extra-small text-white-50" style="font-size: 0.8rem;">© 2026 Flyora Travel Inc. All rights reserved.</p>
    </div>
</footer>
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    if (localStorage.getItem("theme") === "dark") {
        document.body.classList.add("dark-theme");
    }

    document.addEventListener("DOMContentLoaded", function () {
        const toggleBtn = document.getElementById("theme-toggle");

        if (toggleBtn) {
            toggleBtn.addEventListener("click", function () {
                document.body.classList.toggle("dark-theme");
                if (document.body.classList.contains("dark-theme")) {
                    localStorage.setItem("theme", "dark");
                } else {
                    localStorage.setItem("theme", "light");
                }
            });
        }
    });
</script>
</body>
</html>
